[project]
name = "billing-agent"
version = "0.1.0"
description = "AI billing support assistant (CLI agent) for the SE4458 midterm, Group 2"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "mcp>=2.3",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
